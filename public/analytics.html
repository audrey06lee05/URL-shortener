<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — URL Shortener</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Click Analytics</h1>
    <p><a href="index.html">&larr; Back to all URLs</a></p>
  </header>

  <main>
    <section id="analytics-section">
      <p id="analytics-loading" class="hint">Loading...</p>
      <p id="analytics-error" class="error" hidden></p>

      <div id="analytics-content" hidden>
        <p class="url-meta">
          <strong id="analytics-short-url"></strong><br />
          <span id="analytics-original-url" class="hint"></span>
        </p>

        <div class="stat-row">
          <div class="stat-box">
            <span class="stat-label">Total Clicks</span>
            <span id="stat-total-clicks" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Created</span>
            <span id="stat-created" class="stat-value-small"></span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Last Click</span>
            <span id="stat-last-click" class="stat-value-small"></span>
          </div>
        </div>

        <h2>Clicks by Day</h2>
        <p id="clicks-by-day-empty" class="hint" hidden>No clicks yet.</p>
        <table id="clicks-by-day-table" hidden>
          <thead>
            <tr><th>Date</th><th>Clicks</th></tr>
          </thead>
          <tbody id="clicks-by-day-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
